<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contractor Work Offer</title><style>body{font-family:system-ui,sans-serif;background:#eef4f8;color:#18334e;margin:0}main{max-width:490px;margin:8vh auto;padding:20px}.card{background:white;border-radius:18px;padding:25px}button{width:100%;border:0;border-radius:12px;padding:17px;margin:8px 0;font-size:17px;font-weight:700;background:#166eaa;color:white}button.alt{background:#566a7a}button:disabled{opacity:.5}.note{font-size:13px;color:#536575}#status{padding:10px;border-radius:10px;background:#eaf2fa}</style></head><body><main><div class="card"><h2>New work offer</h2><p class="note">Only use links supplied by an authorized dispatch system. This page does not display customer contact information. A provider's acceptance is provisional until the customer approves the assignment.</p><p id="status" role="status">Checking offer link…</p><button id="accept" disabled>Accept job</button><button id="decline" disabled class="alt">Decline</button><p class="note">No actual text notification service is connected yet.</p></div></main><script>
const qs=new URLSearchParams(location.hash.slice(1)),offer=qs.get('offer'),token=qs.get('token');history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),accept=document.getElementById('accept'),decline=document.getElementById('decline');
if(!/^[0-9a-f-]{36}$/i.test(offer||'')||!/^[0-9a-f]{64}$/.test(token||'')){status.textContent='Missing or invalid offer link. No action was taken.'}else{status.textContent='Offer link received. Accepting does not finalize a customer appointment.';accept.disabled=false;decline.disabled=false}
async function respond(action){accept.disabled=true;decline.disabled=true;status.textContent='Submitting response…';try{const r=await fetch('https://stsmdfxcekkxpngkfrmz.supabase.co/functions/v1/contractor-offer-response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer_id:offer,token,action})});const d=await r.json();status.textContent=!r.ok?'Could not submit: '+(d.error||r.status):d.result==='accepted'?'You accepted this offer. The customer must still confirm the provider and terms.':d.result==='declined'?'Offer declined.': 'This offer is unavailable or expired.'}catch(e){status.textContent='Connection problem. Please contact dispatch to check the offer.'}}
accept.onclick=()=>respond('accept');decline.onclick=()=>respond('decline');
</script></body></html>
