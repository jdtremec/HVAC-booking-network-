<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c48"><title>ServiceNow — Fast HVAC Scheduling Pilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#13283d;font-family:system-ui,-apple-system,Arial,sans-serif}header{background:#102c48;color:white;padding:22px 16px}header section,main{max-width:650px;margin:auto}h1{margin:0;font-size:27px}h2{font-size:24px}p{line-height:1.5}.muted{color:#617489}.small{font-size:13px}.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 10px #152c4810}.notice{background:#fff1c7;border-radius:12px;padding:12px;margin:12px 0;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{flex:1;background:#dce7f2;color:#183954}.tabs .active{background:#143b62;color:#fff}button{font:inherit;font-weight:700;background:#1463a3;color:white;border:0;border-radius:12px;padding:16px 18px;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#e7eef5;color:#153a5d}.danger{background:#ad3b3b}main{padding:12px 16px 40px}.full{width:100%;margin-top:10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{background:#f4f7fa;color:#15344f;border:2px solid #d6e2ec;min-height:75px;text-align:left}.choice.selected{border-color:#176bb1;background:#e2f3ff}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}input,textarea,select{font:inherit;width:100%;border:1px solid #a5b6c7;border-radius:11px;padding:14px;background:white}input[type=checkbox]{width:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:7px;background:#d9e5ee;border-radius:8px;overflow:hidden}.fill{height:100%;background:#2585c5}.tag{background:#e9eef4;border-radius:30px;padding:5px 10px;font-size:12px}.line{border-bottom:1px solid #e6edf2;padding:14px 0}.success{background:#e3f8eb;border-radius:12px;padding:12px;color:#176839}a{color:#1363a4}.price{font-size:27px;font-weight:800}.foot{font-size:12px;color:#617489;margin-top:20px}</style></head><body><header><section><h1>ServiceNow <span style="font-size:13px;opacity:.75">PILOT</span></h1><div>HVAC help, without the phone tag.</div></section></header><main><div class="notice"><strong>DEMO ONLY:</strong> No live appointments, charges, contractor notifications, or shared accounts. Data stays in this browser. Please use test names and numbers only.</div><div class="tabs"><button class="active" data-view="customer">Get service</button><button data-view="provider">Contractor</button><button data-view="admin">Dispatch</button></div><div id="root"></div></main><script>
const KEY='servicenow-pilot-2',cities=['Jackson','Brandon','Ridgeland','Madison'],issues=['AC not cooling','Heat not working','Maintenance','New system quote','Other issue'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateIn=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const format=(d,t)=>new Date(d+'T'+t+':00').toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const initial=()=>({providers:[{id:'calvin',name:'Superb HVAC Services',city:cities,minimum:0,callout:0,diagnostic:0,hourly:0,pricingReady:false,open:[]}],jobs:[],events:[]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}
let view='customer',step=0,form={issue:'',city:'',date:'',time:'',name:'',phone:'',note:'',guest:true},message='',contractor='calvin';
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));
const events=x=>{db.events.unshift(new Date().toLocaleString()+' '+x);db.events=db.events.slice(0,50)};
const holds=(pid,d,t)=>db.jobs.some(j=>j.provider===pid&&j.date===d&&j.time===t&&(j.status==='approved'||j.status==='assigned'||j.status==='awaiting_customer'||(j.status==='requested'&&Date.now()-j.created<30*60*1000)));
const available=()=>db.providers.flatMap(p=>p.pricingReady&&p.city.includes(form.city)?p.open.filter(s=>s.date>=dateIn(0)&&!holds(p.id,s.date,s.time)).map(s=>({...s,pid:p.id,visit:Math.max(p.minimum,p.callout+p.diagnostic)})):[]).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const selectedProvider=()=>db.providers.find(p=>p.id===contractor)||db.providers[0];
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('root').innerHTML=(message?'<p class="success">'+esc(message)+'</p>':'')+(view==='customer'?customer():view==='provider'?provider():admin());message='';bind()}
function customer(){if(step===4){return '<div class="card"><h2>Request received in this demo</h2><p>We’ll match your request with an available licensed provider in the live version. An appointment is only confirmed after the assigned provider accepts and you review the provider details and terms.</p><p class="muted">No message has been sent.</p><button class="full" id="again">Start another test request</button></div>'}
let title=['What needs fixing?','Where do you need help?','Pick a time','How can we reach you?'][step],inside='';
if(step===0)inside='<div class="choices">'+issues.map(i=>'<button class="choice '+(form.issue===i?'selected':'')+'" data-issue="'+esc(i)+'">'+esc(i)+'</button>').join('')+'</div>';
if(step===1)inside='<label>Which city?</label><div class="choices">'+cities.map(c=>'<button class="choice '+(form.city===c?'selected':'')+'" data-city="'+c+'">'+c+'</button>').join('')+'</div>';
if(step===2){let slots=available();inside='<p class="small muted">Times are examples from contractor-entered availability. Every request requires approval.</p>'+(slots.length?slots.slice(0,20).map(s=>'<button class="choice full '+(form.date===s.date&&form.time===s.time?'selected':'')+'" data-slot="'+s.pid+'|'+s.date+'|'+s.time+'"><div class="row"><span>'+format(s.date,s.time)+'</span><span>Visit from $'+s.visit.toFixed(2)+'</span></div></button>').join(''):'<div class="notice">No published times yet. Open the Contractor tab, save sample pricing and add appointment windows.</div>')}
if(step===3)inside='<div class="row"><strong>Guest checkout</strong><span class="tag">No password required</span></div><label>Test name</label><input id="cust-name" value="'+esc(form.name)+'" autocomplete="off" maxlength="80"><label>Test phone</label><input id="cust-phone" value="'+esc(form.phone)+'" inputmode="tel" autocomplete="off" maxlength="25"><label>What should the technician know?</label><textarea id="cust-note" maxlength="450">'+esc(form.note)+'</textarea><p class="small muted">Account login and SMS verification will be added to the secure live backend. Do not enter actual customer information here.</p>';
return '<div class="card"><div class="row"><span class="muted small">Step '+(step+1)+' of 4</span><strong>Fast booking</strong></div><div class="bar"><div class="fill" style="width:'+((step+1)*25)+'%"></div></div><h2>'+title+'</h2>'+inside+'<div class="row" style="margin-top:18px">'+(step?'<button class="secondary" id="back">Back</button>':'<span></span>')+'<button id="next">'+(step===3?'Request appointment':'Continue')+' →</button></div></div>'}
function provider(){let p=selectedProvider();return '<div class="card"><h2>Contractor workspace</h2><label>Company</label><select id="select-provider">'+db.providers.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><h3>Set your rates</h3><form id="rates">'+[['minimum','Minimum visit charge'],['callout','Call-out fee'],['diagnostic','Diagnostic charge'],['hourly','Hourly labor charge']].map(([k,l])=>'<label>'+l+' ($)</label><input type="number" min="0" step=".01" name="'+k+'" value="'+p[k]+'" required>').join('')+'<button class="full">Save pricing</button></form><h3>Post available times</h3><form id="opening"><label>Day</label><input type="date" name="date" min="'+dateIn(0)+'" value="'+dateIn(1)+'" required><label>Time</label><select name="time">'+['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00'].map(t=>'<option value="'+t+'">'+t+'</option>').join('')+'</select><button class="full">Publish opening</button></form>'+p.open.map(s=>'<div class="line row"><span>'+format(s.date,s.time)+'</span><button class="secondary" data-remove="'+s.date+'|'+s.time+'">Remove</button></div>').join('')+'</div><div class="card"><h2>Incoming job requests</h2>'+db.jobs.filter(j=>j.provider===p.id).slice().reverse().map(jobCard).join('')+(db.jobs.filter(j=>j.provider===p.id).length?'':'<p class="muted">No requests yet.</p>')+'</div>'}
function jobCard(j){let status=j.status==='requested'&&Date.now()-j.created>=1800000?'expired':j.status;return '<div class="line"><div class="row"><strong>'+esc(j.issue)+' • '+esc(j.city)+'</strong><span class="tag">'+status+'</span></div><p>'+format(j.date,j.time)+'</p><p class="muted small">Test customer: '+esc(j.name)+' — '+esc(j.phone)+'</p><p class="small">'+esc(j.note)+'</p>'+(status==='requested'?'<button data-action="approve|'+j.id+'">Accept assignment</button> <button class="secondary" data-action="decline|'+j.id+'">Decline</button>':status==='awaiting_customer'?'<p class="small">Awaiting customer confirmation; details shown in Dispatch.</p>':status==='approved'?'<button data-action="complete|'+j.id+'">Mark completed</button> <button class="danger" data-action="cancel|'+j.id+'">Cancel</button>':'')+'</div>'}
function admin(){return '<div class="card"><h2>Private dispatch</h2><div class="row"><div><strong>'+db.jobs.length+'</strong><div class="muted small">Requests</div></div><div><strong>'+db.providers.length+'</strong><div class="muted small">Providers</div></div><div><strong>'+db.jobs.filter(j=>j.status==='cancelled').length+'</strong><div class="muted small">Cancellations</div></div></div><h3>Jobs</h3>'+db.jobs.slice().reverse().map(j=>{let p=db.providers.find(x=>x.id===j.provider);return '<div class="line"><b>'+esc(j.issue)+'</b> • '+esc(j.city)+'<p class="small">'+format(j.date,j.time)+' • '+esc(p?.name)+' • '+esc(j.status)+'</p>'+(j.status==='awaiting_customer'?'<p class="small">Provider accepted. Customer must review provider identity and terms before a real booking can be finalized.</p><button data-action="confirm|'+j.id+'">Simulate customer confirmation</button>':'')+'</div>'}).join('')+'<h3>Add test provider</h3><form id="add-provider"><label>Business name</label><input name="name" required maxlength="80"><button class="full">Add test contractor</button></form><button class="secondary full" id="reset">Reset demo data</button></div><div class="card"><h3>Activity</h3>'+db.events.map(x=>'<div class="line small">'+esc(x)+'</div>').join('')+'</div>'}
function bind(){document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{form.issue=b.dataset.issue;render()});document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{form.city=b.dataset.city;render()});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{let [p,d,t]=b.dataset.slot.split('|');form.provider=p;form.date=d;form.time=t;render()});document.getElementById('back')?.addEventListener('click',()=>{step--;render()});document.getElementById('next')?.addEventListener('click',()=>{if(step===0&&!form.issue||step===1&&!form.city||step===2&&!form.date){message='Choose an option before continuing.';render();return}if(step===3){form.name=document.getElementById('cust-name').value.trim();form.phone=document.getElementById('cust-phone').value.trim();form.note=document.getElementById('cust-note').value.trim();if(!form.name||!form.phone){message='Enter a test name and phone.';render();return}if(holds(form.provider,form.date,form.time)){message='That time is already reserved. Choose another.';step=2;render();return}let j={id:'j'+Date.now(),provider:form.provider,issue:form.issue,city:form.city,date:form.date,time:form.time,name:form.name,phone:form.phone,note:form.note,status:'requested',created:Date.now()};db.jobs.push(j);events('Demo request submitted');persist();step=4;render();return}step++;render()});document.getElementById('again')?.addEventListener('click',()=>{step=0;form={issue:'',city:'',date:'',time:'',name:'',phone:'',note:'',guest:true};render()});document.getElementById('select-provider')?.addEventListener('change',e=>{contractor=e.target.value;render()});document.getElementById('rates')?.addEventListener('submit',e=>{e.preventDefault();let p=selectedProvider(),f=new FormData(e.target);['minimum','callout','diagnostic','hourly'].forEach(k=>p[k]=Number(f.get(k)));p.pricingReady=true;events('Test rates saved for '+p.name);persist();message='Sample rates saved';render()});document.getElementById('opening')?.addEventListener('submit',e=>{e.preventDefault();let p=selectedProvider(),f=new FormData(e.target),d=f.get('date'),t=f.get('time');if(!p.open.some(s=>s.date===d&&s.time===t))p.open.push({date:d,time:t});events('Availability published');persist();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let p=selectedProvider(),[d,t]=b.dataset.remove.split('|');if(db.jobs.some(j=>j.provider===p.id&&j.date===d&&j.time===t&&['requested','awaiting_customer','approved'].includes(j.status))){message='A request is attached to this opening. Resolve it first.';render();return}p.open=p.open.filter(s=>s.date!==d||s.time!==t);events('Availability removed');persist();render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let [act,id]=b.dataset.action.split('|'),j=db.jobs.find(x=>x.id===id);if(!j)return;if(act==='approve'&&j.status==='requested')j.status='awaiting_customer';if(act==='decline'&&j.status==='requested')j.status='declined';if(act==='confirm'&&j.status==='awaiting_customer')j.status='approved';if(act==='complete'&&j.status==='approved')j.status='completed';if(act==='cancel'&&j.status==='approved'){let reason=prompt('Reason for cancellation?');if(!reason?.trim())return;j.status='cancelled';j.reason=reason.trim()}events('Demo job '+act);persist();render()});document.getElementById('add-provider')?.addEventListener('submit',e=>{e.preventDefault();let n=new FormData(e.target).get('name').trim();db.providers.push({id:'p'+Date.now(),name:n,city:[...cities],minimum:0,callout:0,diagnostic:0,hourly:0,pricingReady:false,open:[]});events('Demo provider added');persist();render()});document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('Delete local demo data?')){db=initial();contractor='calvin';persist();render()}})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></body></html>
