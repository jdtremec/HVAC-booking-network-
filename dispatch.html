<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Dispatch — Home Services</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fa;color:#192f48;margin:0}header{background:#13395f;color:white;padding:19px}main{max-width:750px;padding:16px;margin:auto}.card{background:white;padding:20px;border-radius:14px;margin:12px 0;box-shadow:0 1px 6px #0012}input,select,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #adbccc;box-sizing:border-box}input,select,textarea{width:100%;margin:5px 0 12px}button{background:#1468a6;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-weight:600}small,.muted{color:#657587}.warn{background:#fff0ca;padding:12px;border-radius:9px}hr{border:0;border-top:1px solid #ddd}a{color:inherit}</style></head><body><header><strong>Home Services — Private Dispatch <small style="color:#fff">Build 2026.10.13.1</small></strong></header><main><p class="warn">STAFF ACCESS ONLY. Work orders are stored in Supabase. Do not create real customer orders until the privacy and dispatch workflow has been fully tested.</p><div id="app">Loading…</div></main><script type="module">

const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;let profile=null;

async function init(){const {data:{user}}=await supabase.auth.getUser();current=user;if(!user){showLogin();return}const {data,error}=await supabase.from('profiles').select('role,display_name').eq('id',user.id).maybeSingle();if(error||!data||!['admin','dispatcher'].includes(data.role)){app.innerHTML='<div class="card"><h2>Access not granted</h2><p>Your account is not yet authorized for staff dispatch.</p><button id="signout">Sign out</button></div>';document.getElementById('signout').onclick=async()=>{await supabase.auth.signOut();init()};return}profile=data;await dashboard()}
function showLogin(){app.innerHTML='<div class="card"><h2>Dispatcher sign-in</h2><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Your approved email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button id="login">Sign in</button><button id="magic">Email sign-in link</button></div><p id="message" role="status"></p><small>Access is limited to approved dispatchers and administrators. Sign-in email links may require redirect configuration in Supabase.</small></div>';document.getElementById('login').onclick=async()=>{msg('Signing in…');const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)msg(error.message);else init()};document.getElementById('magic').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){msg('Enter your email first');return}const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});msg(error?error.message:'If authorized, check your email for a sign-in link.')}}
async function dashboard(){const {data:callListings, error:directoryError}=await supabase.from('call_directory').select('id,business_name,trade,phone,base_area,source,vetting_status').order('business_name');const {data:providers}=await supabase.from('contractors').select('id,business_name,trade,phone,status,license_verified,insurance_verified').order('business_name');const {data:coverage}=await supabase.from('contractor_coverage').select('contractor_id,zip_code');const {data,error}=await supabase.from('work_orders').select('id,trade,issue,city,zip_code,preferred_start,status,claimed_by,created_at,customer_name,customer_phone,street_address').order('created_at',{ascending:false}).limit(50);app.innerHTML='<div class="card"><div class="row"><h2>Shared Work Orders</h2><button id="refresh">Refresh</button><button id="logout">Sign out</button></div><p>Signed in as '+esc(current.email)+' · '+esc(profile.role)+'</p><p id="message" role="status"></p></div><div class="card"><h3>New test work order</h3><form id="new"><label>Trade</label><select name="trade"><option>HVAC</option><option>Plumbing</option></select><label>Issue</label><input name="issue" value="Test service request" required><label>City</label><input name="city" value="Pearl" required><label>ZIP</label><input name="zip" value="39208" pattern="[0-9]{5}" required><label>Appointment requested</label><input name="time" type="datetime-local" required><button>Create test order</button></form></div><div class="card"><h3>Tri-county call directory</h3><p><small>Publicly listed prospects only—not verified partners. Check details when calling.</small></p><label>Filter</label><select id="trade-filter"><option value="All">All services</option><option>HVAC</option><option>Plumbing</option></select><label>Choose business</label><select id="call-directory-choice"><option value="">Choose contractor</option></select><div id="quick-call"></div><label>Search names or areas</label><input id="contractor-search" placeholder="Search by company or city" aria-label="Search contractors"><div id="contractor-results"></div><h3>Add candidate contractor</h3><form id="add-candidate"><label>Company</label><input name="business_name" maxlength="100" required><label>Trade</label><select name="trade"><option>HVAC</option><option>Plumbing</option></select><label>Business phone</label><input name="phone" type="tel" maxlength="24" required><p><small>Candidates stay pending until license and insurance checks are recorded. Do not enter confidential information.</small></p><button>Add candidate</button></form></div><div class="card"><h3>Job queue</h3>'+(error?'<p>Error: '+esc(error.message)+'</p>':!data.length?'<p>No work orders yet.</p>':data.map(j=>'<section style="padding:12px 0;border-bottom:1px solid #dde"><strong>'+esc(j.trade)+' — '+esc(j.issue)+'</strong><p>'+esc(j.city)+' '+esc(j.zip_code)+' · '+esc(j.status)+'</p><small>'+esc(new Date(j.preferred_start).toLocaleString())+'</small><div class="row"><button data-claim="'+j.id+'" '+(j.claimed_by&&j.claimed_by!==current.id?'disabled':'')+'>'+(j.claimed_by===current.id?'Claimed by you':j.claimed_by?'Claimed by another':'Take ownership')+'</button><button data-call="'+j.id+'">Record call</button><button data-assign="'+j.id+'">Assign contractor</button></div></section>').join(''))+'</div>';const drawDirectory=()=>{const q=(document.getElementById('contractor-search')?.value||'').toLowerCase(),trade=document.getElementById('trade-filter')?.value||'All';const items=(callListings||[]).filter(p=>(trade==='All'||p.trade===trade||p.trade==='Both')&&(p.business_name+' '+p.base_area).toLowerCase().includes(q));const sel=document.getElementById('call-directory-choice');sel.innerHTML='<option value="">Choose contractor ('+items.length+')</option>'+items.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.business_name)+' · '+esc(p.base_area)+'</option>').join('');const chosen=(callListings||[]).find(p=>p.id===sel.value);document.getElementById('quick-call').innerHTML=directoryError?'<p>Directory unavailable: '+esc(directoryError.message)+'</p>':'<p><small>Choose a company above to see its number. These are unverified listings.</small></p>';document.getElementById('contractor-results').innerHTML='<p><small>'+items.length+' matching call prospects. Use the dropdown above to select one.</small></p>';sel.onchange=()=>{const p=(callListings||[]).find(x=>x.id===sel.value);document.getElementById('quick-call').innerHTML=p?'<p><strong>'+esc(p.business_name)+'</strong> · '+esc(p.trade)+' · '+esc(p.base_area)+'</p><p><small>Status: '+esc(p.vetting_status)+' · Listed number: '+esc(p.phone)+'</small></p><a href="tel:'+esc(p.phone.replace(/[^0-9+]/g,''))+'">📞 Call '+esc(p.phone)+'</a>':'<p>Select a business</p>'}};document.getElementById('contractor-search').oninput=drawDirectory;document.getElementById('trade-filter').onchange=drawDirectory;drawDirectory();document.getElementById('refresh').onclick=dashboard;document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();init()};document.getElementById('new').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const time=f.get('time');if(!time){msg('Choose appointment time');return}const payload={trade:f.get('trade'),issue:f.get('issue'),city:f.get('city'),zip_code:f.get('zip'),preferred_start:new Date(time).toISOString(),customer_name:'TEST CUSTOMER',customer_phone:'000-000-0000',street_address:'TEST ADDRESS — NOT REAL',status:'new'};const {error}=await supabase.from('work_orders').insert(payload);if(error)msg(error.message);else dashboard()};document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{const el=b.closest('section');let status=el.querySelector('.claim-status');if(!status){status=document.createElement('p');status.className='claim-status';status.setAttribute('role','status');status.style.cssText='background:#edf5ff;padding:10px;border-radius:8px';b.parentNode.after(status)}b.disabled=true;b.textContent='Claiming…';status.textContent='Contacting shared dispatch database…';try{const {data,error}=await supabase.from('work_orders').update({claimed_by:current.id,updated_at:new Date().toISOString()}).eq('id',b.dataset.claim).is('claimed_by',null).in('status',['new','needs_manual_dispatch']).select('id');if(error){status.textContent='Could not claim job: '+error.message;b.disabled=false;b.textContent='Try again';return}if(!data||data.length===0){status.textContent='Job was already claimed or its status changed. Refresh the queue.';b.disabled=false;b.textContent='Refresh to check';return}status.textContent='Success — this work order is assigned to your dispatch account.';b.textContent='Claimed by you';await dashboard()}catch(e){status.textContent='Connection error: '+(e?.message||'Please retry');b.disabled=false;b.textContent='Try again'}});document.getElementById('add-candidate').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const payload={business_name:String(fd.get('business_name')).trim(),trade:fd.get('trade'),phone:String(fd.get('phone')).trim(),status:'pending',license_verified:false,insurance_verified:false};const {error}=await supabase.from('contractors').insert(payload);if(error)msg('Could not add candidate: '+error.message);else dashboard()};document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const {data:job,error:jobError}=await supabase.from('work_orders').select('trade,zip_code,status').eq('id',b.dataset.assign).single();if(jobError){msg(jobError.message);return}const matching=(providers||[]).filter(p=>p.trade===job.trade&&p.status==='approved'&&p.license_verified&&p.insurance_verified&&(coverage||[]).some(c=>c.contractor_id===p.id&&c.zip_code===job.zip_code));if(!matching.length){msg('No verified, approved '+job.trade+' providers serving ZIP '+job.zip_code+' yet. Add candidates and complete verification first.');return}const el=b.closest('section');let chooser=el.querySelector('.assign-panel');if(chooser){chooser.remove();return}chooser=document.createElement('div');chooser.className='assign-panel';chooser.innerHTML='<label>Select an approved contractor</label><select class="assign-choice">'+matching.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.business_name)+'</option>').join('')+'</select><button class="assign-confirm">Assign for customer approval</button><p class="assign-feedback" role="status"></p>';el.appendChild(chooser);chooser.querySelector('.assign-confirm').onclick=async()=>{const selected=chooser.querySelector('.assign-choice').value;const {data,error}=await supabase.rpc('assign_dispatch_contractor',{p_order:b.dataset.assign,p_contractor:selected});if(error)chooser.querySelector('.assign-feedback').textContent=error.message;else if(!data)chooser.querySelector('.assign-feedback').textContent='Unable to assign. Check provider eligibility and job status.';else dashboard()}});document.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{const panel=b.closest('section');let form=panel.querySelector('.call-panel');if(form){form.remove();return}form=document.createElement('div');form.className='call-panel';form.innerHTML='<label>Contractor contacted</label><select name="contractor">'+(providers||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.business_name)+' — '+esc(p.trade)+'</option>').join('')+'</select><label>Call outcome</label><select name="outcome"><option value="no_answer">No answer</option><option value="declined">Declined</option><option value="callback">Callback needed</option><option value="available">Available</option><option value="accepted">Accepted pending verification</option></select><label>Notes</label><textarea name="notes" maxlength="500" placeholder="Test note only"></textarea><button class="save-call">Save call outcome</button><p class="feedback" role="status"></p>';panel.appendChild(form);form.querySelector('.save-call').onclick=async()=>{let contractorId=form.querySelector('[name=contractor]').value;if(!contractorId){form.querySelector('.feedback').textContent='Add a contractor candidate first.';return}const payload={work_order_id:b.dataset.call,operator_id:current.id,contractor_id:contractorId,outcome:form.querySelector('[name=outcome]').value,notes:form.querySelector('[name=notes]').value};const {error}=await supabase.from('dispatch_calls').insert(payload);if(error)form.querySelector('.feedback').textContent='Save failed: '+error.message;else form.querySelector('.feedback').textContent='Call outcome saved to shared database.'}});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current&&profile)dashboard()});
