<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Dispatch — Home Services</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fa;color:#192f48;margin:0}header{background:#13395f;color:white;padding:19px}main{max-width:750px;padding:16px;margin:auto}.card{background:white;padding:20px;border-radius:14px;margin:12px 0;box-shadow:0 1px 6px #0012}input,select,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #adbccc;box-sizing:border-box}input,select,textarea{width:100%;margin:5px 0 12px}button{background:#1468a6;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}label{display:block;font-weight:600}small,.muted{color:#657587}.warn{background:#fff0ca;padding:12px;border-radius:9px}hr{border:0;border-top:1px solid #ddd}a{color:inherit}</style></head><body><header><strong>Home Services — Private Dispatch</strong></header><main><p class="warn">STAFF ACCESS ONLY. Work orders are stored in Supabase. Do not create real customer orders until the privacy and dispatch workflow has been fully tested.</p><div id="app">Loading…</div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://stsmdfxcekkxpngkfrmz.supabase.co','sb_publishable__kI8gOs_U9nO-4xxyeHMFA_vKXgYF4t',{auth:{persistSession:true,autoRefreshToken:true}});
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;let profile=null;
function msg(t){const el=document.getElementById('message');if(el)el.textContent=t}
async function init(){const {data:{user}}=await supabase.auth.getUser();current=user;if(!user){showLogin();return}const {data,error}=await supabase.from('profiles').select('role,display_name').eq('id',user.id).maybeSingle();if(error||!data||!['admin','dispatcher'].includes(data.role)){app.innerHTML='<div class="card"><h2>Access not granted</h2><p>Your account is not yet authorized for staff dispatch.</p><button id="signout">Sign out</button></div>';document.getElementById('signout').onclick=async()=>{await supabase.auth.signOut();init()};return}profile=data;await dashboard()}
function showLogin(){app.innerHTML='<div class="card"><h2>Dispatcher sign-in</h2><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Your approved email"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div class="row"><button id="login">Sign in</button><button id="magic">Email sign-in link</button></div><p id="message" role="status"></p><small>Access is limited to approved dispatchers and administrators. Sign-in email links may require redirect configuration in Supabase.</small></div>';document.getElementById('login').onclick=async()=>{msg('Signing in…');const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)msg(error.message);else init()};document.getElementById('magic').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){msg('Enter your email first');return}const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});msg(error?error.message:'If authorized, check your email for a sign-in link.')}}
async function dashboard(){const {data:providers}=await supabase.from('contractors').select('id,business_name,trade,phone,status,license_verified,insurance_verified').order('business_name');const {data:coverage}=await supabase.from('contractor_coverage').select('contractor_id,zip_code');const {data,error}=await supabase.from('work_orders').select('id,trade,issue,city,zip_code,preferred_start,status,claimed_by,created_at,customer_name,customer_phone,street_address').order('created_at',{ascending:false}).limit(50);app.innerHTML='<div class="card"><div class="row"><h2>Shared Work Orders</h2><button id="refresh">Refresh</button><button id="logout">Sign out</button></div><p>Signed in as '+esc(current.email)+' · '+esc(profile.role)+'</p><p id="message" role="status"></p></div><div class="card"><h3>New test work order</h3><form id="new"><label>Trade</label><select name="trade"><option>HVAC</option><option>Plumbing</option></select><label>Issue</label><input name="issue" value="Test service request" required><label>City</label><input name="city" value="Pearl" required><label>ZIP</label><input name="zip" value="39208" pattern="[0-9]{5}" required><label>Appointment requested</label><input name="time" type="datetime-local" required><button>Create test order</button></form></div><div class="card"><h3>Job queue</h3>'+(error?'<p>Error: '+esc(error.message)+'</p>':!data.length?'<p>No work orders yet.</p>':data.map(j=>'<section style="padding:12px 0;border-bottom:1px solid #dde"><strong>'+esc(j.trade)+' — '+esc(j.issue)+'</strong><p>'+esc(j.city)+' '+esc(j.zip_code)+' · '+esc(j.status)+'</p><small>'+esc(new Date(j.preferred_start).toLocaleString())+'</small><div class="row"><button data-claim="'+j.id+'" '+(j.claimed_by&&j.claimed_by!==current.id?'disabled':'')+'>'+(j.claimed_by===current.id?'Claimed by you':j.claimed_by?'Claimed by another':'Take ownership')+'</button><button data-call="'+j.id+'">Record call</button></div></section>').join(''))+'</div>';const drawDirectory=()=>{let q=(document.getElementById('contractor-search')?.value||'').toLowerCase();document.getElementById('contractor-results').innerHTML=(providers||[]).filter(p=>(p.business_name+' '+p.trade).toLowerCase().includes(q)).map(p=>'<div style="padding:10px 0;border-bottom:1px solid #ddd"><strong>'+esc(p.business_name)+'</strong> · '+esc(p.trade)+'<p><small>'+esc((coverage||[]).filter(c=>c.contractor_id===p.id).map(c=>c.zip_code).join(', ')||'No verified ZIP coverage')+' · '+(p.status==='approved'&&p.license_verified&&p.insurance_verified?'Approved':'Verification pending')+'</small></p>'+(p.phone?'<a href="tel:'+esc(p.phone.replace(/[^0-9+]/g,''))+'">Call '+esc(p.phone)+'</a>':'No phone entered')+'</div>').join('')||'<p>No matching contractors yet.</p>'};document.getElementById('contractor-search').oninput=drawDirectory;drawDirectory();document.getElementById('refresh').onclick=dashboard;document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();init()};document.getElementById('new').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const time=f.get('time');if(!time){msg('Choose appointment time');return}const payload={trade:f.get('trade'),issue:f.get('issue'),city:f.get('city'),zip_code:f.get('zip'),preferred_start:new Date(time).toISOString(),customer_name:'TEST CUSTOMER',customer_phone:'000-000-0000',street_address:'TEST ADDRESS — NOT REAL',status:'new'};const {error}=await supabase.from('work_orders').insert(payload);if(error)msg(error.message);else dashboard()};document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{const {data,error}=await supabase.rpc('claim_dispatch_order',{p_order:b.dataset.claim});if(error)msg(error.message);else if(!data)msg('Already claimed, unavailable, or changed. Refresh.');else dashboard()});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const eligible=(providers||[]).filter(p=>p.status==='approved'&&p.license_verified&&p.insurance_verified);if(!eligible.length){msg('No verified, approved contractors in the directory yet.');return}const choices=eligible.map(p=>p.business_name+' ['+p.id+']').join('\n');const chosen=prompt('Select contractor ID from this list:\n'+choices);if(!chosen)return;const {data,error}=await supabase.rpc('assign_dispatch_contractor',{p_order:b.dataset.assign,p_contractor:chosen.trim()});if(error)msg(error.message);else if(!data)msg('Assignment unavailable: check trade, ZIP coverage, verification and status.');else dashboard()});document.querySelectorAll('[data-call]').forEach(b=>b.onclick=async()=>{const note=prompt('Test call note (no real personal information):');if(!note)return;const outcome=prompt('Outcome: no_answer, declined, callback, available, accepted','no_answer');if(!['no_answer','declined','callback','available','accepted'].includes(outcome))return;const {error}=await supabase.from('dispatch_calls').insert({work_order_id:b.dataset.call,operator_id:current.id,outcome,notes:note});if(error)msg(error.message);else msg('Call record saved')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&current&&profile)dashboard()});
supabase.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(init,0)});init();
</script></body></html>
