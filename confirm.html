<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Your Service</title><style>body{font:16px system-ui;background:#f2f6fa;color:#19374f;margin:0}main{max-width:540px;margin:7vh auto;padding:18px}.card{background:white;border-radius:16px;padding:23px}h1{font-size:25px}dt{color:#637689;font-size:13px}dd{margin:0 0 15px;font-weight:650}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:10px;background:#116ba5;color:white;font:inherit;font-weight:bold}button:disabled{opacity:.5}.warning{background:#fff2c9;padding:12px;border-radius:9px}label{display:block;margin:15px 0}small{color:#657889}</style></head><body><main><h1>Review Your Service</h1><div class="card"><p id="status" role="status">Checking approval link…</p><div id="details"></div></div><p><small>The provider is an independent business responsible for the repair. This platform coordinates scheduling; additional repairs must be quoted and authorized separately.</small></p></main><script>
const params=new URLSearchParams(location.hash.slice(1));const token=params.get('token');history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),details=document.getElementById('details');const endpoint='https://stsmdfxcekkxpngkfrmz.supabase.co/functions/v1/customer-approval';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,agree){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,agree})});return {ok:r.ok,data:await r.json()}}
async function init(){if(!/^[a-f0-9]{64}$/.test(token||'')){status.textContent='No valid appointment approval link found.';return}try{const r=await call('preview');if(!r.ok||!r.data.ok){status.textContent='This approval link is expired or unavailable.';return}let x=r.data;status.textContent='Please review before confirming.';details.innerHTML='<dl><dt>Provider</dt><dd>'+esc(x.provider)+'</dd><dt>Service</dt><dd>'+esc(x.trade)+' — '+esc(x.issue)+'</dd><dt>Proposed appointment</dt><dd>'+esc(new Date(x.appointment).toLocaleString())+'</dd><dt>Authorized diagnostic / visit charge</dt><dd>$'+Number(x.visit_charge).toFixed(2)+'</dd></dl><p>Repairs, materials and other charges require a separate quote and your approval. The provider is responsible for performing the work.</p><label><input id="agree" type="checkbox"> I understand the provider, proposed appointment, visit charge and that work is performed by the independent provider.</label><button id="approve" disabled>Approve this appointment</button>';document.getElementById('agree').onchange=e=>document.getElementById('approve').disabled=!e.target.checked;document.getElementById('approve').onclick=async()=>{const b=document.getElementById('approve');b.disabled=true;status.textContent='Confirming…';try{const y=await call('accept',true);status.textContent=y.ok&&y.data.status==='confirmed'?'Your appointment was confirmed.':'Could not confirm; please contact dispatch.';if(y.ok)details.textContent='Confirmation recorded.';else b.disabled=false}catch{status.textContent='Connection failed. Please contact dispatch.';b.disabled=false}}}catch{status.textContent='Unable to load the link; please try again later.'}}
init();
</script></body></html>
